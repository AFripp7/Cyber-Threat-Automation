name: Run CTI Automator
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  fetch-threats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch_threats.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Commit threat data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add threats.csv
          git diff --staged --quiet || git commit -m "Updated threat feed $(date)"
          git push
